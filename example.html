<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Z-Icons Demo</title>

  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .label {
      font-size: 0.85rem;
      opacity: 0.6;
    }

  </style>
</head>
<body>

  <h1>z-icons — Demo</h1>

  <!-- 1. OBLIGATORIO: cargar el Web Component -->
  <script type="module" src="./src/Icon.js"></script>

  <!-- 2. Los íconos comienzan a renderizar -->

  <h2>Iconos core</h2>
  <div class="row">
    <z-icon name="sun" type="core" size="32"></z-icon>
    <z-icon name="moon" type="core" size="32"></z-icon>
    <span class="label">core: sun, moon</span>
  </div>

  <h2>Diferentes tamaños</h2>
  <div class="row">
    <z-icon name="sun" type="core" size="16" class="text-red"></z-icon>
    <z-icon name="sun" type="core" size="24"></z-icon>
    <z-icon name="sun" type="core" size="32"></z-icon>
    <z-icon name="sun" type="core" size="48"></z-icon>
  </div>

  <h2>Colores personalizados</h2>
  <div class="row">
    <z-icon name="sun" type="core" color="orange" size="32"></z-icon>
    <z-icon name="sun" type="core" color="red" size="32"></z-icon>
    <z-icon name="moon" type="core" color="blue" size="32"></z-icon>
    <z-icon name="moon" type="core" color="#6366f1" size="32"></z-icon>
  </div>

  <h2>Uso dentro de un botón</h2>
  <button style="padding: 8px 16px; border-radius: 8px; display:flex; gap:8px; align-items:center;">
    <z-icon name="sun" type="core" size="20"></z-icon>
    Cambiar tema
  </button>

</body>
</html>
