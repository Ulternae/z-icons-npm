name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, typecheck and test
        run: pnpm run check

      - name: Pack @zcorvus/icons
        run: npm pack --dry-run
        working-directory: packages/icons

      - name: Pack @zcorvus/icons-react
        run: npm pack --dry-run
        working-directory: packages/icons-react
