<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZCorvus Icons - External Sprite</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #09090b;
        color: #fafafa;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      main {
        display: grid;
        gap: 20px;
        width: min(760px, calc(100% - 40px));
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 16px;
      }

      .card {
        display: grid;
        place-items: center;
        gap: 12px;
        min-height: 140px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.06);
      }

      .icon {
        width: 44px;
        height: 44px;
      }

      code {
        color: #d4d4d8;
        font-size: 0.82rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>External Sprite</h1>
      <section class="grid">
        <article class="card">
          <svg class="icon" aria-hidden="true">
            <use href="https://cdn.jsdelivr.net/npm/@zcorvus/icons@0.1.3/dist/sprites/mina.svg#mina-search"></use>
          </svg>
          <code>mina.svg#mina-search</code>
        </article>
        <article class="card">
          <svg class="icon" aria-hidden="true">
            <use href="https://cdn.jsdelivr.net/npm/@zcorvus/icons@0.1.3/dist/sprites/mina-solid.svg#mina-search-solid"></use>
          </svg>
          <code>mina-solid.svg#mina-search-solid</code>
        </article>
      </section>
    </main>
  </body>
</html>
