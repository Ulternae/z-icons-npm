<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZCorvus Icons Web - Inline SVG</title>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@zcorvus/icons-web@0.2.0/dist/register-mina.js/+esm"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@zcorvus/icons-web@0.2.0/dist/register-mina-solid.js/+esm"></script>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #09090b;
        color: #fafafa;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      main {
        display: grid;
        gap: 20px;
        width: min(760px, calc(100% - 40px));
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 16px;
      }

      .card {
        display: grid;
        place-items: center;
        gap: 12px;
        min-height: 140px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.06);
      }

      code {
        color: #d4d4d8;
        font-size: 0.82rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Inline SVG Web Components</h1>
      <section class="grid">
        <article class="card">
          <z-mina name="search" size="44"></z-mina>
          <code>&lt;z-mina name="search"&gt;</code>
        </article>
        <article class="card">
          <z-mina-solid name="search" size="44"></z-mina-solid>
          <code>&lt;z-mina-solid name="search"&gt;</code>
        </article>
        <article class="card">
          <z-mina name="heart" size="44"></z-mina>
          <code>&lt;z-mina name="heart"&gt;</code>
        </article>
        <article class="card">
          <z-mina name="settings" size="44"></z-mina>
          <code>&lt;z-mina name="settings"&gt;</code>
        </article>
      </section>
    </main>
  </body>
</html>
